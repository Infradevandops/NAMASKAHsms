# VRENUM SMS - Production Docker Compose
# Uses external Neon PostgreSQL + Upstash Redis
# Usage: docker compose up -d

services:
  # =============================================================================
  # VRENUM API Application
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrenum-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./static:/app/static
    networks:
      - vrenum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # Nginx Reverse Proxy
  # =============================================================================
  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: vrenum-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/app/static:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vrenum-network

  # =============================================================================
  # Certbot for SSL (Let's Encrypt)
  # =============================================================================
  certbot:
    image: certbot/certbot
    container_name: vrenum-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - vrenum-network

volumes:
  certbot_webroot:
    driver: local

networks:
  vrenum-network:
    driver: bridge
