repos:
  # Gitleaks - Detect secrets in git history
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect secrets with gitleaks
        stages: [pre-commit]

  # Detect Private Key
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        name: Detect private keys
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-yaml
        name: Check YAML syntax
      - id: end-of-file-fixer
        name: Fix end of file
      - id: trailing-whitespace
        name: Trim trailing whitespace

  # Bandit - Security linter for Python
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        name: Bandit security check
        args: ['-c', 'config/.bandit', '-r', 'app/', '--severity-level', 'medium']
        language: python
        types: [python]

  # Black - Code formatter
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Format code with black
        language_version: python3.9

  # Flake8 - Linter
  - repo: https://github.com/PyCQA/flake8
    rev: 960c1d286190804104f7255b97da034446fdaac3  # frozen: 7.5.0
    hooks:
      - id: flake8
        name: Lint with flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']
        language_version: python3.11

  # isort - Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ['--profile', 'black']

  # Mypy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy
        name: Type check with mypy
        args: ['--ignore-missing-imports', '--no-error-summary']
        language_version: python3.11

  # YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ['-d', '{extends: default, rules: {line-length: {max: 120}}}']

  # JSON validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
        name: Check JSON syntax

# Global settings
default_language_version:
  python: python3.11

# Exclude certain paths
exclude: |
  (?x)^(
    venv/|
    .venv/|
    node_modules/|
    dist/|
    build/|
    \.git/|
    migrations/|
    alembic/versions/
  )

# Fail fast on first error
fail_fast: false

# Minimum Python version
minimum_pre_commit_version: '2.15.0'
