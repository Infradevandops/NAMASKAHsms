name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/vrenum/Vrenum
            git fetch origin main
            git reset --hard origin/main
            cd /root/vrenum
            docker compose up -d --build --force-recreate
            echo "⏳ Waiting for app to be healthy..."
            for i in $(seq 1 40); do
              if curl -fs http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Deploy complete and healthy (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/40 — retrying in 15s..."
              sleep 15
            done
            echo "❌ App did not become healthy after 10 minutes"
            docker compose logs --tail=50
            exit 1
          command_timeout: 30m

      - name: Purge Cloudflare cache
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            CF_ZONE_ID="${{ secrets.CF_ZONE_ID }}"
            CF_API_TOKEN="${{ secrets.CF_API_TOKEN }}"
            if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
              echo "⚠️ CF secrets not set — skipping purge"
              exit 0
            fi
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' 2>/dev/null || echo '{}')
            echo "CF purge response: $RESPONSE"
            echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print('✅ CF cache purged' if r.get('success') else f'⚠️ CF purge: {r}')" 2>/dev/null || echo "⚠️ CF purge unparseable"
          command_timeout: 2m
