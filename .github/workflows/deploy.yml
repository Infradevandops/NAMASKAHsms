name: Deploy to Production

# Only deploy when CI passes — never on a failing push
on:
  workflow_run:
    workflows: ["CI - Minimal & Reliable"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VM
    runs-on: ubuntu-latest
    # Hard gate: skip entirely if CI did not pass
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/vrenum
            git fetch origin main
            git reset --hard origin/main

            # Validate no pending migrations before rebuilding
            echo "🔍 Checking migration state..."
            docker compose run --rm app alembic check 2>/dev/null && echo "✅ Migrations up to date" || echo "⚠️ Pending migrations detected — will apply on startup"

            docker compose up -d --build --force-recreate
            echo "⏳ Waiting for app to be healthy..."
            for i in $(seq 1 40); do
              STATUS=$(curl -fs http://localhost:8000/health 2>/dev/null || echo "")
              if echo "$STATUS" | grep -q '"status":"healthy"'; then
                echo "✅ Deploy complete and healthy (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/40 — retrying in 15s... ($STATUS)"
              sleep 15
            done
            echo "❌ App did not become healthy after 10 minutes"
            docker compose logs --tail=50
            exit 1
          command_timeout: 30m

      - name: Purge Cloudflare cache
        if: success()
        run: |
          # GH Actions runners are blocked from api.cloudflare.com
          # Static assets use ?v={{ app_version }} cache busters on every deploy
          echo "ℹ️ CF auto-purge skipped (runner network restriction). Static assets use ?v= cache busters."
          echo "✅ Deploy complete. New JS/CSS will be served via versioned URLs."
