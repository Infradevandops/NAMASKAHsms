name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/vrenum
            git pull origin main
            docker compose up -d --build
            echo "✅ Deploy complete"

      - name: Health check (24 retries × 15s)
        run: |
          for i in {1..24}; do
            if curl -fs "${{ secrets.PRODUCTION_URL }}/health" > /dev/null; then
              echo "✅ Production healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/24 — retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 6 minutes"
          exit 1
