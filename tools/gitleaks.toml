# Gitleaks Configuration — Strict Mode
# Scans ALL files. No blanket path exemptions for docs/ or scripts/.
# Any push containing a real credential pattern is rejected by CI.
#
# Rules are precise to avoid false positives on test fixtures.
# Test files use password123/admin123 as fixture values — those are
# intentionally NOT matched here (they are not real credentials).

[[rules]]
id = "high-entropy-api-key"
description = "High-entropy API key assignment (32+ chars)"
regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['"]?([a-zA-Z0-9_\-]{40,})['"]?'''
entropy = 4.0
secretGroup = 2

[[rules]]
id = "database-url-with-password"
description = "Database connection string with embedded password"
regex = '''(postgres|postgresql|mysql|mongodb):\/\/[^:@\s]+:[^@\s]{8,}@[a-zA-Z0-9\.\-]+'''

[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[a-zA-Z0-9]{20,}'''

[[rules]]
id = "paystack-live-secret"
description = "Paystack live secret key"
regex = '''sk_live_[a-zA-Z0-9]{24,}'''

[[rules]]
id = "onesignal-key"
description = "OneSignal API key"
regex = '''os_v2_[a-zA-Z0-9_\-]{20,}'''

[[rules]]
id = "sentry-dsn"
description = "Sentry DSN with real project credentials"
regex = '''https://[a-f0-9]{32}@o[0-9]+\.ingest\.(us|de|eu)\.sentry\.io/[0-9]+'''

[[rules]]
id = "google-oauth-client-id"
description = "Google OAuth client ID"
regex = '''[0-9]{12}-[a-z0-9]{32}\.apps\.googleusercontent\.com'''

[[rules]]
id = "private-key-header"
description = "Private key block"
regex = '''-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'''

[[rules]]
id = "jwt-secret-hardcoded"
description = "JWT secret hardcoded with real-looking value (not a placeholder)"
regex = '''(?i)(jwt[_-]?secret[_-]?key|jwt[_-]?secret)\s*[=:]\s*['"]([a-zA-Z0-9@#$%^&*_\-]{24,})['"]'''
entropy = 3.8
secretGroup = 2

  [rules.allowlist]
  description = "Dev placeholder values and CI test keys"
  regexes = [
    '''dev-jwt-secret-key-change-in-production''',
    '''dev-secret-key-change-in-production''',
    '''local-jwt-secret-key''',
    '''test-jwt-secret-key-for-ci''',
    '''change-in-production''',
  ]
  paths = [
    '''\.env\.development''',
    '''.github/workflows/ci\.yml''',
    '''config/\.env\.example''',
    '''config/\.env\.production\.example''',
  ]

[allowlist]
description = "Allowlist — only specific placeholder files, never entire folders"
paths = [
    '''config/\.env\.example''',
    '''config/\.env\.production\.example''',
    '''deploy/docker/\.env\.production\.example''',
    '''\.env\.example''',
    '''\.env\.production\.example''',
    '''\.env\.development''',
    '''.github/workflows/ci\.yml''',
    '''docs/operations/security/CREDENTIAL_ROTATION_CHECKLIST\.md''',
    '''scripts/deployment/setup_env\.sh''',
    '''deploy/monitoring/docker-compose\.yml'''
]
regexes = [
    # Placeholder patterns — not real values
    '''your[-_]?[a-z\-]+[-_]?key''',
    '''your[-_]?[a-z\-]+[-_]?secret''',
    '''your[-_]?[a-z\-]+[-_]?password''',
    '''xxxxxxxxxxxxxxxxxxxxxxxxxxxx''',
    '''<[a-z\-]+>''',
    '''change[-_]?me''',
    # Template/placeholder DB URLs — not real credentials
    '''postgresql://user:password@host''',
    '''postgresql://[^:]+:\$\{[A-Z_]+\}@''',
    '''postgresql://[^:]+:<[A-Z_]+>@''',
    '''\$\{POSTGRES_PASSWORD\}''',
    # CI test values — these are intentional test-only strings
    '''test-secret-key-for-ci''',
    '''test-jwt-secret-key-for-ci''',
    '''test_password_for_ci_only''',
    '''test-jwt-secret-key-for-ci-testing''',
    # Dev/local placeholder values — not real credentials
    '''dev-secret-key-change-in-production''',
    '''dev-jwt-secret-key-change-in-production''',
    '''local-jwt-secret-key''',
    '''change-in-production''',
    # Platform internal API key format (not real secrets)
    '''nsk_live_[a-zA-Z0-9]{24,128}''',
    '''nsk_[a-zA-Z0-9]{24,128}''',
    # Paystack test keys (not live)
    '''sk_test_[a-zA-Z0-9]{24,128}'''
]
