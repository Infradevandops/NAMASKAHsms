# Gitleaks Configuration
[allowlist]
description = "Global allowlist for testing and false positives"
paths = [
    '''tests/.*''',
    '''app/utils/security\.py''',
    '''app/services/api_key_service\.py''',
    '''app/schemas/.*''',
    '''scripts/security_scan\.py''',
    '''requirements.*\.txt''',
    '''config/\.env\.example''',
    '''config/\.env\.production\.example''',
    '''deploy/docker/\.env\.production\.example''',
    '''\.env\.example''',
    '''\.env\.production\.example''',
    '''.github/workflows/ci\.yml'''
]
# NOTE: docs/ and scripts/ are NO LONGER allowlisted.
# They were previously allowlisted which caused real credentials
# committed to docs/archive/ and scripts/ to be missed by CI.
regexes = [
    '''sk_live_[a-zA-Z0-9]{24,128}''',
    '''sk_test_[a-zA-Z0-9]{24,128}''',
    '''nsk_[a-zA-Z0-9]{24,128}''',
    '''nsk_live_[a-zA-Z0-9]+''',
    '''test_password_for_ci_only''',
    '''test_secret_key_for_testing''',
    '''test-secret-key-for-ci''',
    '''test-jwt-secret-key-for-ci''',
    '''ChangeMe@[0-9]+''',
    '''<admin-password>''',
    '''<your-vps-ip>''',
    '''<your-textverified''',
    '''xxxxxxxxxxxxxxxxxxxxxxxxxxxx'''
]
